[package]
name = "commander-voice"
version = "0.9.0"
description = "Play decoder voice on a PipeWire sink"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "commander-voice"
path = "src/main.rs"

[dependencies]
pipewire = { version = "0.9.2", features = ["v0_3_77"] }
spa_sys = { package = "libspa-sys", version = "0.9" }
