[package]
name = "commander"
version = "0.8.5"
description = "Hamspot Commander rig-control face"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "commander"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "persistence", "system_fonts", "wayland", "x11"] }
egui = "0.37"
rustcars = { git = "https://github.com/webaugur/rustcars", rev = "f0ffc2bed9533ef1c78a5fee097c3f189a4efdb3" }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rigctl = { path = "../rigctl" }
hsrec = { path = "../hsrec" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
rfd = "0.15"
libc = "0.2.190"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serialport = "4.10.1"
