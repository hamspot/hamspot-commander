[package]
name = "hsrec"
version = "0.1.0"
description = "HamSpot Commander REC: raw IQ recordings, database, replay, archive"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "commander-rec"
path = "src/bin/commander-rec.rs"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
sha2 = "0.10"
libc = "0.2.190"
