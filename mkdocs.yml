site_name: HamSpot Commander
repo_url: https://github.com/hamspot/hamspot-commander
edit_uri: ""
docs_dir: build/docs-src
site_dir: build/site
theme:
  name: material
  features: [navigation.sections, navigation.top, search.highlight, toc.follow]
  palette:
    - scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
plugins: [search]
markdown_extensions: [admonition, tables, attr_list, toc: {permalink: true}, pymdownx.superfences]
nav:
  - User Guide: index.md
  - User Guide (PDF): UserGuide.pdf
  - Patchbay: patchbay.md
  - Audio graph: AudioGraph.md
  - Rotators:
      - Overview: rotator/README.md
      - G-5500 notes: rotator/G-5500-notes.md
      - G-1000 notes: rotator/G-1000-notes.md
  - Downloads (GitHub Releases): https://github.com/hamspot/hamspot-commander/releases/latest
